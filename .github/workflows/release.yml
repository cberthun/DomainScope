name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: curl, openssl, pdo_mysql, mbstring
      - name: Tag matches VERSION and CHANGELOG
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: PHP syntax and script tests
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null; done
          bash tests/scripts/update.test.sh
      - name: Build the release archive
        run: scripts/make-release.sh
      - name: Release notes from the CHANGELOG
        run: awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "DomainScope $GITHUB_REF_NAME" --notes-file notes.md \
            dist/domainscope-"$GITHUB_REF_NAME".tar.gz dist/domainscope-"$GITHUB_REF_NAME".tar.gz.sha256
